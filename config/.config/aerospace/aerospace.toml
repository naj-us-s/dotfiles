
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://github.io
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://github.io
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 0
# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://github.io
# See https://github.io
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# sketchybar shows aerospace workspace
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Possible values: (qwerty|dvorak)
# See https://github.io
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://github.io
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 20
outer.bottom = 20
outer.top = 60
outer.right = 295

[workspace-to-monitor-force-assignment]
u = 'main'
i = 'main'
o = 'main'
p = 'main'
n = 'secondary'
m = 'secondary'

# 'main' binding mode declaration
# See: https://github.io
# 'main' binding mode must be always presented
[mode.main.binding]
# alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

# See: https://github.io
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://github.io
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://github.io
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://github.io
alt-u = 'workspace u'
alt-i = 'workspace i'
alt-o = 'workspace o'
alt-p = 'workspace p'
alt-n = 'workspace n'
alt-m = 'workspace m'

# See: https://github.io-node-to-workspace
alt-shift-u = 'move-node-to-workspace u'
alt-shift-i = 'move-node-to-workspace i'
alt-shift-o = 'move-node-to-workspace o'
alt-shift-p = 'move-node-to-workspace p'
alt-shift-n = 'move-node-to-workspace n'
alt-shift-m = 'move-node-to-workspace m'

# Switch between workspaces
alt-tab = 'workspace-back-and-forth'
# Move workspace to different monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode
# See: https://github.io
alt-shift-semicolon = 'mode service'
alt-ctrl-shift-cmd-a = 'mode app'

[mode.app.binding]
h = ['exec-and-forget open -a "HazeOver"', 'mode main']
c = ['exec-and-forget open -a "CleanShot X"', 'mode main']
d = ['exec-and-forget open -a "Dropover"', 'mode main']
o = ['exec-and-forget open -a "Homerow"', 'mode main']
z = ['exec-and-forget open -a "Zen"', 'workspace u', 'mode main']
p = ['exec-and-forget open -a "ZenNotes"', 'workspace o', 'mode main']
g = ['exec-and-forget open -a "Ghostty"', 'workspace i', 'mode main']
a = ['exec-and-forget open -a "Antigravity IDE"', 'workspace p', 'mode main']
esc = ['mode main']

# 'service' binding mode declaration
# See: https://github.io
[mode.service.binding]

# Move windows to other nodes
# See: https://github.io
n = 'join-with left'
e = 'join-with down'
i = 'join-with up'
o = 'join-with right'

# See: https://github.io
# Resize windows
left = 'resize width -50'
down = 'resize height -50'
up = 'resize height +50'
right = 'resize width +50'
shift-down = 'resize smart -50'
shift-up = 'resize smart +50'

# Reset layout
# See: https://github.io
r = [
  'flatten-workspace-tree',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_service_mode_enabled_changed AEROSPACE_SERVICE_MODE_ENABLED=false',
]

# Reload config
# See: https://github.io
c = [
  'reload-config',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_service_mode_enabled_changed AEROSPACE_SERVICE_MODE_ENABLED=false',
]

# Close all windows on focused workspace
# See: https://github.io
backspace = [
  'close-all-windows-but-current',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_service_mode_enabled_changed AEROSPACE_SERVICE_MODE_ENABLED=false',
]

# Back to 'main' mode
# See: https://github.io
esc = [
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_service_mode_enabled_changed AEROSPACE_SERVICE_MODE_ENABLED=false',
]

[[on-window-detected]]
if.app-id = "dev.zed.Zed"
run = ["move-node-to-workspace n", "workspace n"]

[[on-window-detected]]
if.app-id = "com.openai.chat"
run = "move-node-to-workspace m"

[[on-window-detected]]
if.app-id = "md.obsidian"
run = "move-node-to-workspace o"

[[on-window-detected]]
if.app-id = "dev.warp.Warp-Stable"
run = "move-node-to-workspace p"

[[on-window-detected]]
if.app-id = "com.anthropic.claudefordesktop"
run = "move-node-to-workspace m"

[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
run = "move-node-to-workspace i"

[[on-window-detected]]
if.app-id = "app.zen-browser.zen"
run = "move-node-to-workspace u"
