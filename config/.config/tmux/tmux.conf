if-shell '[ -f ~/.config/tmux/tmux.reset.conf ]' "source-file ~/.config/tmux/tmux.reset.conf"

set -g default-terminal "xterm-256color"
set -as terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top

setw -g mode-keys vi

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'JonRoosevelt/tmux-oxocarbon'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# vim-tmux-navigator uses C-h, C-j, C-k, C-l by default.
# Customizing it with multiple space-separated keys causes errors.

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths '~/dotfiles'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-x-path '~/dotfiles'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

set -g status-style "fg=#f2f4f8,bg=#161616"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=#161616]#{?client_prefix,#[bg=#d4bbff],#[bg=#33b1ff]}#[bold] #S #[fg=#161616,bg=#161616,nobold]#{?client_prefix,#[fg=#d4bbff],#[fg=#33b1ff]}"
set -g status-right "#[fg=#33b1ff,bg=#161616]#[fg=#161616,bg=#33b1ff,bold] #{b:pane_current_path} #[fg=#33b1ff,bg=#161616]"
setw -g window-status-format "#[fg=#6f6f6f,bg=#161616]#[fg=#161616,bg=#6f6f6f]#I:#W#[fg=#6f6f6f,bg=#161616]"
setw -g window-status-current-format "#[fg=#08bdba,bg=#161616]#[fg=#161616,bg=#08bdba,bold]#I:#W#[fg=#08bdba,bg=#161616]"
set -g message-style "fg=#161616,bg=#be95ff"

# Sesh Session Manager Integration
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {2..}' \
    --color=bg+:#131313,bg:#131313,spinner:#be95ff,hl:#33b1ff \
    --color=fg:#f2f4f8,header:#525252,info:#08bdba,pointer:#33b1ff \
    --color=marker:#33b1ff,fg+:#f2f4f8,prompt:#33b1ff,hl+:#33b1ff \
    --color=gutter:#131313,border:#525252
)\""
bind -N "last-session (via sesh)" L run-shell "sesh-last"


run '~/.tmux/plugins/tpm/tpm'

