# Kanagawa color scheme for WezTerm
[colors]
foreground = "#dcd7ba"
background = "#1f1f28"

cursor_bg = "#c8c093"
cursor_fg = "#1f1f28"
cursor_border = "#c8c093"

selection_fg = "#c8c093"
selection_bg = "#2d4f67"

scrollbar_thumb = "#16161d"
split = "#16161d"

# ANSI colors
ansi = [
  "#090618",  # black
  "#c34043",  # red
  "#76946a",  # green
  "#c0a36e",  # yellow
  "#7e9cd8",  # blue
  "#957fb8",  # magenta
  "#6a9589",  # cyan
  "#c8c093",  # white
]

brights = [
  "#727169",  # bright black
  "#e82424",  # bright red
  "#98bb6c",  # bright green
  "#e6c384",  # bright yellow
  "#7fb4ca",  # bright blue
  "#938aa9",  # bright magenta
  "#7aa89f",  # bright cyan
  "#dcd7ba",  # bright white
]

[metadata]
name = "kagawana"
author = "Kanagawa Theme"
origin_url = "https://github.com/rebelot/kanagawa.nvim"
